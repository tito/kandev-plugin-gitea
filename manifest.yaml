id: "kandev-plugin-gitea"
api_version: 1
version: "0.1.0"
display_name: "Gitea"
description: "Source-control plugin for self-hosted Gitea instances: repositories, branches, pull requests, reviews, CI status, watches, and composer references."
author: "tito"
categories: ["source-control"]

min_kandev_version: "0.94.0"

runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"
    linux-arm64: "server/plugin-linux-arm64"
    darwin-amd64: "server/plugin-darwin-amd64"
    darwin-arm64: "server/plugin-darwin-arm64"
    windows-amd64: "server/plugin-windows-amd64.exe"

capabilities:
  state: true
  secrets: true
  api_read: ["tasks", "workspaces", "workflows", "agent_profiles", "repositories"]
  api_write: ["tasks"]

actions:
  - key: "connection.get"
    scope: "workspace"
    max_body_bytes: 1024
  - key: "connection.save"
    scope: "workspace"
    max_body_bytes: 16384
  - key: "connection.disconnect"
    scope: "workspace"
    max_body_bytes: 1024
  - key: "repositories.list"
    scope: "workspace"
    max_body_bytes: 16384
  - key: "repositories.inspect"
    scope: "workspace"
    max_body_bytes: 16384
  - key: "repositories.branches"
    scope: "workspace"
    max_body_bytes: 16384
  - key: "change_requests.create"
    scope: "task"
    max_body_bytes: 65536
  - key: "change_requests.get"
    scope: "task"
    max_body_bytes: 1024
  - key: "change_requests.link"
    scope: "task"
    max_body_bytes: 16384
  - key: "change_requests.unlink"
    scope: "task"
    max_body_bytes: 4096
  - key: "change_requests.associations"
    scope: "workspace"
    max_body_bytes: 1024

repository_providers: ["gitea"]

reference_sources:
  - source: "gitea_pull_requests"
    provider: "gitea"
    kind: "pull_request"
    display_name: "Gitea pull requests"
    kind_label: "Pull request"
    order: 100

ui:
  bundle: "/ui/bundle.js"
